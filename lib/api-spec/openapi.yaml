openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operations control tower summaries and activity
  - name: orders
    description: Customer orders and vendor sub-orders
  - name: inventory
    description: Inventory reservation health
  - name: fulfillment
    description: Fulfillment exceptions and shipment operations
  - name: vendors
    description: Vendor operations
  - name: settlements
    description: Settlement readiness and payout operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /activity:
    get:
      operationId: getActivity
      tags: [dashboard]
      summary: Get recent operations activity
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 8
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"
  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List customer orders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/{orderId}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get an order with sub-orders and lines
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetail"
        "404":
          description: Order not found
    post:
      operationId: applyOrderAction
      tags: [orders]
      summary: Apply a controlled operations action to an order
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderActionInput"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Action is not allowed
        "404":
          description: Order not found
  /inventory/overview:
    get:
      operationId: getInventoryOverview
      tags: [inventory]
      summary: Get inventory reservation overview
      responses:
        "200":
          description: Inventory overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryOverview"
  /fulfillment/exceptions:
    get:
      operationId: listFulfillmentExceptions
      tags: [fulfillment]
      summary: List fulfillment exceptions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Fulfillment exceptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FulfillmentException"
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors and operational readiness
      responses:
        "200":
          description: Vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
  /settlements/summary:
    get:
      operationId: getSettlementSummary
      tags: [settlements]
      summary: Get settlement readiness summary
      responses:
        "200":
          description: Settlement summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementSummary"
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required:
        - grossMerchandiseValue
        - ordersToday
        - activeExceptions
        - settlementReady
        - reservationRate
        - pipeline
      properties:
        grossMerchandiseValue:
          type: number
        ordersToday:
          type: integer
        activeExceptions:
          type: integer
        settlementReady:
          type: number
        reservationRate:
          type: number
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStage"
    PipelineStage:
      type: object
      required: [label, value, count, tone]
      properties:
        label:
          type: string
        value:
          type: number
        count:
          type: integer
        tone:
          type: string
    ActivityItem:
      type: object
      required: [id, type, title, detail, occurredAt, tone]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
        tone:
          type: string
        orderId:
          type: ["string", "null"]
    Order:
      type: object
      required:
        - id
        - customerName
        - customerEmail
        - status
        - paymentStatus
        - fulfillmentStatus
        - total
        - currency
        - vendorCount
        - itemCount
        - createdAt
        - returnWindow
      properties:
        id:
          type: string
        customerName:
          type: string
        customerEmail:
          type: string
        status:
          type: string
        paymentStatus:
          type: string
        fulfillmentStatus:
          type: string
        total:
          type: number
        currency:
          type: string
        vendorCount:
          type: integer
        itemCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        returnWindow:
          type: string
        exception:
          type: ["string", "null"]
    OrderDetail:
      allOf:
        - $ref: "#/components/schemas/Order"
        - type: object
          required: [subOrders, lines, timeline]
          properties:
            subOrders:
              type: array
              items:
                $ref: "#/components/schemas/VendorSubOrder"
            lines:
              type: array
              items:
                $ref: "#/components/schemas/OrderLine"
            timeline:
              type: array
              items:
                $ref: "#/components/schemas/TimelineEvent"
    OrderLine:
      type: object
      required: [id, sku, title, vendorName, quantity, unitPrice, status]
      properties:
        id:
          type: string
        sku:
          type: string
        title:
          type: string
        vendorName:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
        status:
          type: string
    VendorSubOrder:
      type: object
      required: [id, vendorName, status, itemCount, fulfillmentNode, shipmentStatus]
      properties:
        id:
          type: string
        vendorName:
          type: string
        status:
          type: string
        itemCount:
          type: integer
        fulfillmentNode:
          type: string
        shipmentStatus:
          type: string
    TimelineEvent:
      type: object
      required: [id, label, detail, occurredAt, tone]
      properties:
        id:
          type: string
        label:
          type: string
        detail:
          type: string
        occurredAt:
          type: string
          format: date-time
        tone:
          type: string
    OrderActionInput:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [resolve_exception, place_on_hold, release_hold]
    InventoryOverview:
      type: object
      required: [availableUnits, reservedUnits, reservationRate, expiringReservations, nodes]
      properties:
        availableUnits:
          type: integer
        reservedUnits:
          type: integer
        reservationRate:
          type: number
        expiringReservations:
          type: integer
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/InventoryNode"
    InventoryNode:
      type: object
      required: [id, name, region, available, reserved, health]
      properties:
        id:
          type: string
        name:
          type: string
        region:
          type: string
        available:
          type: integer
        reserved:
          type: integer
        health:
          type: string
    FulfillmentException:
      type: object
      required: [id, orderId, title, detail, severity, age, owner, status]
      properties:
        id:
          type: string
        orderId:
          type: string
        title:
          type: string
        detail:
          type: string
        severity:
          type: string
        age:
          type: string
        owner:
          type: string
        status:
          type: string
    Vendor:
      type: object
      required: [id, name, category, status, orders, payable, health]
      properties:
        id:
          type: string
        name:
          type: string
        category:
          type: string
        status:
          type: string
        orders:
          type: integer
        payable:
          type: number
        health:
          type: number
    SettlementSummary:
      type: object
      required: [eligibleAmount, pendingAmount, nextRun, batches, vendorCount]
      properties:
        eligibleAmount:
          type: number
        pendingAmount:
          type: number
        nextRun:
          type: string
        batches:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBatch"
        vendorCount:
          type: integer
    SettlementBatch:
      type: object
      required: [id, label, amount, vendorCount, status, date]
      properties:
        id:
          type: string
        label:
          type: string
        amount:
          type: number
        vendorCount:
          type: integer
        status:
          type: string
        date:
          type: string

